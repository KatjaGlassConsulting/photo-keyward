[project]
name = "photo-keyward"
version = "0.1.0"
description = "Local photo browser for picking the best shots out of a large library and tagging them with keywords."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Katja Glass Consulting" },
]
keywords = ["photos", "exif", "iptc", "xmp", "keywords", "metadata", "exiftool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
keyward = "photo_keyward.app:main"
keyward-export-dates = "photo_keyward.scripts._cli:main_export_dates"
keyward-import-dates = "photo_keyward.scripts._cli:main_import_dates"
keyward-export-metadata = "photo_keyward.scripts._cli:main_export_metadata"
keyward-import-metadata = "photo_keyward.scripts._cli:main_import_metadata"
keyward-set-date-from-filename = "photo_keyward.scripts._cli:main_set_date_from_filename"
keyward-set-date-from-metadata = "photo_keyward.scripts._cli:main_set_date_from_metadata"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_keyward"]
